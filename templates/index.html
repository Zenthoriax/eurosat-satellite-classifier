<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EuroSAT Satellite Patch Classifier</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111317; color: #f3f4f6; margin: 0; padding: 24px; }
    .container { max-width: 980px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
    .card { background: #1b1f27; border: 1px solid #2c3240; border-radius: 10px; padding: 18px; }
    button { background: #f97316; color: #fff; border: none; border-radius: 6px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    button.secondary { background: #2c3240; margin-left: 8px; }
    .prob-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; }
    .bar-bg { background: #2c3240; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
    .bar-fill { background: #f97316; height: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { border-bottom: 1px solid #2c3240; padding: 8px; text-align: left; }
    img.preview { width: 128px; height: 128px; object-fit: cover; image-rendering: pixelated; display: block; margin-top: 12px; border-radius: 6px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>EuroSAT Satellite Patch Classifier</h1>
    <p>MobileNetV2 (TFLite) land-cover classification on Render with Supabase Storage &amp; Postgres.</p>

    <div class="grid">
      <div class="card">
        <h3>Upload Patch (64x64 RGB)</h3>
        <input type="file" id="imageInput" accept="image/*" />
        <div style="margin-top: 12px;">
          <button id="classifyBtn" type="button">Classify Patch</button>
        </div>
        <img id="previewImg" class="preview" style="display:none;" alt="Patch preview" />
        <p id="statusText" style="margin-top: 12px; font-size: 14px;">Ready.</p>
      </div>

      <div class="card">
        <h3>Class Probabilities</h3>
        <div id="topLabel" style="font-size: 20px; font-weight: 700; margin-bottom: 12px;">—</div>
        <div id="probsList"></div>
      </div>
    </div>

    <div class="card" style="margin-top: 20px;">
      <h3>Supabase Database Explorer</h3>
      <div>
        <label><input type="radio" name="tbl" value="uploaded_patches" checked /> uploaded_patches</label>
        <label style="margin-left: 12px;"><input type="radio" name="tbl" value="training_data" /> training_data</label>
        <label style="margin-left: 12px;"><input type="radio" name="tbl" value="test_data" /> test_data</label>
        <button id="refreshBtn" class="secondary" type="button">Refresh Table</button>
      </div>
      <div style="overflow-x: auto;">
        <table id="dataTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById("imageInput");
    const previewImg = document.getElementById("previewImg");
    const statusText = document.getElementById("statusText");
    const topLabel = document.getElementById("topLabel");
    const probsList = document.getElementById("probsList");

    imageInput.addEventListener("change", () => {
      const f = imageInput.files[0];
      if (!f) return;
      previewImg.src = URL.createObjectURL(f);
      previewImg.style.display = "block";
    });

    document.getElementById("classifyBtn").addEventListener("click", async () => {
      const f = imageInput.files[0];
      if (!f) {
        statusText.textContent = "Please select a satellite patch image first.";
        return;
      }
      statusText.textContent = "Classifying...";
      const fd = new FormData();
      fd.append("image", f);
      const res = await fetch("/api/classify", { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) {
        statusText.textContent = data.error || "Classification failed.";
        return;
      }
      topLabel.textContent = `${data.predicted_label} (${data.confidence_pct}%)`;
      statusText.textContent = `Stored in ${data.bucket}: ${data.storage_path} | Logged to uploaded_patches`;
      probsList.innerHTML = data.probabilities.map(p => {
        const pct = (p.score * 100).toFixed(1);
        return `
          <div class="prob-row"><span>${p.label}</span><span>${pct}%</span></div>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
        `;
      }).join("");
      loadTable();
    });

    async function loadTable() {
      const tbl = document.querySelector('input[name="tbl"]:checked').value;
      const res = await fetch(`/api/table/${tbl}`);
      const data = await res.json();
      const thead = document.querySelector("#dataTable thead");
      const tbody = document.querySelector("#dataTable tbody");
      thead.innerHTML = `<tr>${data.headers.map(h => `<th>${h}</th>`).join("")}</tr>`;
      tbody.innerHTML = data.rows.map(r =>
        `<tr>${data.headers.map(h => `<td>${r[h] ?? ""}</td>`).join("")}</tr>`
      ).join("");
    }

    document.querySelectorAll('input[name="tbl"]').forEach(el => el.addEventListener("change", loadTable));
    document.getElementById("refreshBtn").addEventListener("click", loadTable);
    loadTable();
  </script>
</body>
</html>
